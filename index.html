<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock Holmes | The Midnight Detective</title>

    <style>
        /* MAIN OFFICE BACKGROUND */
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(to bottom,
                    #171a20 0%,
                    #25252a 58%,
                    #392a20 59%,
                    #69452d 100%);
        }

        /* WOODEN FLOOR */
        .office-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                linear-gradient(to bottom,
                    transparent 58%,
                    rgba(0, 0, 0, .25) 59%,
                    transparent 65%),
                repeating-linear-gradient(90deg,
                    #68452f 0px,
                    #68452f 95px,
                    #4d3023 97px,
                    #795337 100px);
        }

        /* SMALL DESK BEHIND TURKEY */
        .desk {
            position: absolute;
            width: 430px;
            height: 105px;
            left: 50%;
            bottom: 20%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom,
                    #855a3c,
                    #553622);
            border: 5px solid #38251d;
            border-radius: 5px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, .5);
            z-index: 1;
        }

        /* DESK FRONT PANEL */
        .desk::before {
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            top: 15px;
            height: 65px;
            background: #68442e;
            border: 3px solid #422a1d;
        }

        /* DESK LEGS */
        .desk::after {
            content: "";
            position: absolute;
            left: 20px;
            right: 20px;
            top: 95px;
            height: 115px;
            border-left: 12px solid #38251d;
            border-right: 12px solid #38251d;
        }

        /* NOTES ON DESK */
        .desk-notes {
            position: absolute;
            width: 100px;
            height: 65px;
            left: 25%;
            bottom: calc(20% + 105px);
            z-index: 2;
            transform: rotate(-8deg);
            background: #d7c49b;
            padding: 9px;
            box-shadow: 2px 4px 8px rgba(0, 0, 0, .4);
        }

        .desk-notes::before {
            content: "CASE NOTES";
            display: block;
            font-family: Georgia, serif;
            font-size: 10px;
            font-weight: bold;
            color: #382a20;
            border-bottom: 1px solid #806c4e;
            padding-bottom: 5px;
        }

        .desk-notes::after {
            content: "Suspect: Unknown\\A Clue: Footprints\\A Status: Open";
            white-space: pre;
            display: block;
            font-family: Georgia, serif;
            font-size: 8px;
            line-height: 13px;
            color: #44372b;
            padding-top: 4px;
        }

        /* DESK LAMP */
        .lamp {
            position: absolute;
            width: 85px;
            height: 120px;
            right: 25%;
            bottom: calc(20% + 105px);
            z-index: 3;
        }

        /* LAMP BASE */
        .lamp::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 50px;
            height: 9px;
            border-radius: 50%;
            background: #292321;
            box-shadow: 0 2px 5px black;
        }

        /* LAMP ARM */
        .lamp::after {
            content: "";
            position: absolute;
            bottom: 7px;
            left: 42px;
            width: 7px;
            height: 85px;
            background: #39302a;
            transform: rotate(18deg);
            transform-origin: bottom;
        }

        /* LAMP SHADE */
        .lamp-shade {
            position: absolute;
            top: 0;
            left: 8px;
            width: 65px;
            height: 40px;
            background: #b58b4c;
            clip-path: polygon(25% 0, 75% 0, 100% 100%, 0 100%);
            filter: drop-shadow(0 3px 3px black);
        }

        /* LAMP LIGHT */
        .lamp-glow {
            position: absolute;
            top: 30px;
            left: -35px;
            width: 140px;
            height: 120px;
            background: radial-gradient(ellipse,
                    rgba(255, 195, 95, .28),
                    transparent 70%);
            pointer-events: none;
        }

        /* =====================================
           2. RAINY VICTORIAN WINDOW
        ===================================== */

        .window {
            position: absolute;
            top: 7%;
            left: 5%;
            width: 29%;
            height: 49%;
            background:
                repeating-linear-gradient(110deg,
                    transparent 0px,
                    transparent 23px,
                    rgba(190, 211, 226, .22) 24px,
                    transparent 26px),
                radial-gradient(ellipse at 50% 40%,
                    #526781,
                    #25344c 65%,
                    #101a2a 100%);

            border: 12px solid #493528;
            outline: 3px solid #a17b50;

            box-shadow:
                inset 0 0 35px rgba(0, 0, 0, .65),
                0 0 35px rgba(91, 140, 185, .18);
        }

        /* Window crossbars */
        .window::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg,
                    transparent 47%,
                    #493528 47%,
                    #493528 53%,
                    transparent 53%),
                linear-gradient(0deg,
                    transparent 47%,
                    #493528 47%,
                    #493528 53%,
                    transparent 53%);
        }

        /* Moonlight */
        .moon {
            position: absolute;
            width: 55px;
            height: 55px;
            top: 12%;
            right: 15%;
            border-radius: 50%;
            background: #e6e3d2;
            box-shadow: 0 0 35px rgba(213, 222, 228, .45);
        }

        /* =====================================
           3. BOOKSHELF AND WALL DETAILS
        ===================================== */

        .bookshelf {
            position: absolute;
            top: 8%;
            right: 5%;
            width: 23%;
            height: 43%;
            background: #30231d;
            border: 7px solid #61432d;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
        }

        .bookshelf::before,
        .bookshelf::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: 8px;
            background: #9b7046;
            box-shadow: 0 3px 5px rgba(0, 0, 0, .5);
        }

        .bookshelf::before {
            top: 50%;
        }

        .bookshelf::after {
            top: 100%;
        }

        .books {
            position: absolute;
            display: flex;
            align-items: flex-end;
            gap: 5px;
            padding: 8px;
            width: 100%;
            height: 49%;
        }

        .books span {
            display: block;
            width: 17%;
            height: 75%;
            border-radius: 2px 2px 0 0;
            border: 1px solid rgba(0, 0, 0, .3);
            box-shadow: inset 2px 0 rgba(255, 255, 255, .12);
        }

        .books span:nth-child(1) {
            background: #743d37;
            height: 85%;
        }

        .books span:nth-child(2) {
            background: #9a7746;
            height: 95%;
        }

        .books span:nth-child(3) {
            background: #344b48;
            height: 72%;
        }

        .books span:nth-child(4) {
            background: #65442f;
            height: 90%;
        }

        .books span:nth-child(5) {
            background: #8c5140;
            height: 78%;
        }

        .books.lower {
            top: 52%;
        }

        /* =====================================
           4. WALL CLOCK
        ===================================== */

        .office-clock {
            position: absolute;
            top: 5%;
            right: 37%;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #d8c49d;
            border: 7px solid #76512f;
            outline: 2px solid #c59a5c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            font-size: 10px;
            font-weight: bold;
            color: #49301f;
            box-shadow: 0 0 15px rgba(0, 0, 0, .5);
        }

        /* =====================================
           5. WOODEN DESK
        ===================================== */

        .desk {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 23%;
            background:
                repeating-linear-gradient(2deg,
                    transparent 0px,
                    transparent 15px,
                    rgba(30, 16, 9, .28) 16px,
                    transparent 19px),
                linear-gradient(180deg,
                    #795137,
                    #503322 55%,
                    #302018);

            border-top: 10px solid #a0784e;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, .3);
        }

        .desk::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(230, 180, 111, .25);
        }

        /* Papers scattered on the desk */
        .paper {
            position: absolute;
            width: 115px;
            height: 75px;
            background: #dfcfac;
            border: 1px solid #9c805d;
            box-shadow: 3px 4px 8px rgba(0, 0, 0, .35);
        }

        .paper::before {
            content: "CASE NOTES";
            display: block;
            padding: 9px;
            font-family: Georgia, serif;
            font-size: 9px;
            font-weight: bold;
            color: #57412e;
            border-bottom: 1px solid #ad9875;
        }

        .paper::after {
            content: "........................";
            display: block;
            padding: 5px;
            font-size: 9px;
            color: #765b43;
        }

        .paper.one {
            left: 8%;
            bottom: 7%;
            transform: rotate(-9deg);
        }

        .paper.two {
            right: 26%;
            bottom: 4%;
            transform: rotate(7deg);
        }

        /* =====================================
           6. ANTIQUE DESK LAMP
        ===================================== */

        .lamp {
            position: absolute;
            right: 7%;
            bottom: 22%;
            width: 100px;
            height: 170px;
        }

        /* Warm glow behind the lamp */
        .lamp-glow {
            position: absolute;
            width: 300px;
            height: 250px;
            right: -95px;
            bottom: -90px;
            background: radial-gradient(ellipse,
                    rgba(255, 190, 99, .23),
                    transparent 70%);
            filter: blur(15px);
        }

        .lamp-shade {
            position: absolute;
            top: 0;
            left: 12px;
            width: 85px;
            height: 48px;
            background: linear-gradient(180deg,
                    #c59a55,
                    #78502d);
            clip-path: polygon(25% 0, 75% 0, 100% 100%, 0 100%);
            border-bottom: 4px solid #e0b76d;
            filter: drop-shadow(0 0 14px rgba(255, 186, 91, .5));
        }

        .lamp-bulb {
            position: absolute;
            top: 39px;
            left: 43px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #ffe2a0;
            box-shadow: 0 0 35px 15px rgba(255, 188, 93, .35);
        }

        .lamp-stem {
            position: absolute;
            top: 48px;
            left: 49px;
            width: 10px;
            height: 95px;
            background: linear-gradient(90deg, #664326, #d0a05b, #664326);
            border-radius: 5px;
        }

        .lamp-base {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 70px;
            height: 15px;
            border-radius: 50%;
            background: #a77b40;
            border: 3px solid #50351f;
        }

        /* =====================================
           7. TURKEY CANVAS
        ===================================== */

        .cartoon {
            --brown1: #753;
            --brown2: #975;
            --orange1: orange;
            --orange2: darkorange;

            width: 80vmin;
            height: 80vmin;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;

            filter: drop-shadow(0 12px 15px rgba(0, 0, 0, .4));
        }

        .cartoon div {
            position: absolute;
            box-sizing: border-box;
        }

        /* =====================================
           8. TURKEY BODY AND WINGS
        ===================================== */

        .body {
            width: 40%;
            height: 40%;
            background: repeating-linear-gradient(90deg,
                    #765338, #765338 8px,
                    #a17d59 8px, #a17d59 11px);
            border: 3px solid #49321f;
            border-radius: 50%;
            top: 40%;
            left: 50%;
            transform: translate(-50%, 0);
            box-shadow: inset 0 0 12px rgba(40, 25, 12, .25);
        }

        .wing {
            height: 30%;
            width: 20%;
            background: repeating-linear-gradient(135deg,
                    #65452f, #65452f 7px,
                    #96704b 7px, #96704b 11px);
            border: 3px solid #49321f;
            border-radius: 100% 0% 100% 5%;
            top: 41%;
            left: 23%;
            transform-origin: top right;
            transform: rotate(-10deg);
            z-index: 5;
        }

        .wing+.wing {
            left: auto;
            right: 43%;
            transform: scaleX(-1) rotate(-10deg);
        }

        /* =====================================
           9. HEAD, NECK AND FACE
        ===================================== */

        .head {
            width: 19%;
            height: 19%;
            border-radius: 50%;
            background: #ebab70;
            border: 2px solid #796044;
            top: 15%;
            left: 50%;
            transform: translate(-50%, 0);
            clip-path: polygon(0% 20%, 100% 20%, 100% 500%, 0% 500%);
        }

        .head::before {
            content: "";
            display: block;
            position: absolute;
            width: 40%;
            height: 120%;
            background: #ebab70;
            top: 80%;
            left: 50%;
            transform: translate(-50%, 0);
            border-radius: 0 0 100% 100% / 30%;
        }

        .eye {
            width: 10%;
            height: 10%;
            background: black;
            border-radius: 50%;
            top: 45%;
            left: 50%;
            transform: translate(-50%, 0) translate(-2.5vmin, 0);
            box-shadow: 5vmin 0;
        }

        .beak {
            width: 4vmin;
            height: 3vmin;
            border-left: 4vmin solid #b77a35;
            border-top: 1.5vmin solid transparent;
            border-bottom: 1.5vmin solid transparent;
            top: 60%;
            left: 50%;
        }

        .red {
            width: 2.5vmin;
            height: 6vmin;
            background: #d00;
            border-radius: 100% / 100% 0 100% 100%;
            top: 60%;
            left: 50%;
            transform: translate(-100%, 0);
        }

        /* =====================================
           10. LEGS AND FEET
        ===================================== */

        .leg {
            width: 3%;
            height: 21%;
            background: #ebab70;
            background-image: repeating-linear-gradient(transparent 0 10%,
                    rgba(0, 0, 0, .1) 0 11%);
            top: 79%;
            left: 50%;
            transform: translate(-50%, 0) translate(-4vmin, 0);
            border-radius: 5vmin / 50%;
        }

        .leg+.leg {
            transform: translate(-50%, 0) translate(4vmin, 0);
        }

        .leg::before,
        .leg::after {
            content: "";
            display: block;
            position: absolute;
            width: 80%;
            height: 35%;
            left: 50%;
            bottom: 0;
            background: #ebab70;
            border-radius: 5vmin;
            transform-origin: 50% 0;
            transform: translate(-50%, 0) rotate(30deg);
        }

        .leg::after {
            transform: translate(-50%, 0) rotate(-30deg);
        }

        /* =====================================
           11. DETECTIVE DEERSTALKER HAT
        ===================================== */

        .hat-bottom {
            width: 35%;
            height: 8%;
            border-radius: 50%;
            background: #49321f;
            border: 2px solid #2d2118;
            top: 15%;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .hat-top {
            width: 16%;
            height: 20%;
            background: repeating-linear-gradient(45deg,
                    #795638, #795638 5px,
                    #b18a5b 5px, #b18a5b 8px);
            border: 3px solid #49321f;
            border-radius: 45% 45% 15% 15%;
            box-shadow: inset 0 5px 8px rgba(255, 255, 255, .2);
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .hat-top::before {
            content: "";
            display: block;
            position: absolute;
            width: 40%;
            height: 2vmin;
            border: 1vmin solid #772;
            border-radius: 1vmin;
            bottom: 3.25vmin;
            left: 50%;
            transform: translate(-50%, 0);
        }

        /* =====================================
           12. DETAILED VINTAGE FEATHERS
        ===================================== */

        .tail {
            width: 10%;
            height: 40%;
            border-radius: 100% / 30% 30% 170% 170%;
            transform-origin: 50% 100%;
            top: 30%;
            left: 50%;
            overflow: visible;
            border: 2px solid #49301f;

            background: linear-gradient(90deg,
                    #513522 0%, #9a7044 18%,
                    #e0bd7e 34%, #fff0cb 48%,
                    #c18b4b 62%, #76502f 82%, #49301f 100%);

            box-shadow:
                inset 0 3px 5px rgba(255, 255, 255, .45),
                inset 0 -4px 7px rgba(45, 25, 10, .35),
                2px 3px 5px rgba(48, 30, 15, .2);
        }

        .tail:nth-child(even) {
            background: linear-gradient(90deg,
                    #49301f 0%, #76502f 18%,
                    #c99a5e 35%, #f6e4bd 50%,
                    #b17d43 66%, #70472b 84%, #382719 100%);
        }

        .tail:nth-child(3n) {
            background: linear-gradient(90deg,
                    #382719 0%, #805532 18%,
                    #d2a45f 35%, #fff0d1 50%,
                    #bd884b 66%, #70452b 84%, #382719 100%);
        }

        /* Feather quills */
        .tail::before {
            content: "";
            position: absolute;
            width: 2px;
            height: 78%;
            left: 50%;
            top: 8%;
            border-radius: 50%;
            background: rgba(75, 45, 23, .65);
            box-shadow: 1px 0 rgba(255, 238, 199, .55);
            transform: translateX(-50%);
        }

        /* Feather eyes */
        .tail::after {
            content: "";
            position: absolute;
            width: 28%;
            height: 18%;
            left: 50%;
            top: 22%;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(ellipse,
                    #f8e8c5 0 18%,
                    #9a6a39 22% 42%,
                    #4b3020 48% 65%,
                    transparent 70%);
            opacity: .9;
        }

        .tail:nth-child(1) {
            transform: translate(-50%, 0) rotate(0);
        }

        .tail:nth-child(2) {
            transform: translate(-50%, 0) rotate(17deg);
        }

        .tail:nth-child(3) {
            transform: translate(-50%, 0) rotate(34deg);
        }

        .tail:nth-child(4) {
            transform: translate(-50%, 0) rotate(51deg);
        }

        .tail:nth-child(5) {
            transform: translate(-50%, 0) rotate(68deg);
        }

        .tail:nth-child(6) {
            transform: translate(-50%, 0) rotate(85deg);
        }

        .tail:nth-child(7) {
            transform: translate(-50%, 0) rotate(102deg);
        }

        .tail:nth-child(8) {
            transform: translate(-50%, 0) rotate(-17deg);
        }

        .tail:nth-child(9) {
            transform: translate(-50%, 0) rotate(-34deg);
        }

        .tail:nth-child(10) {
            transform: translate(-50%, 0) rotate(-51deg);
        }

        .tail:nth-child(11) {
            transform: translate(-50%, 0) rotate(-68deg);
        }

        .tail:nth-child(12) {
            transform: translate(-50%, 0) rotate(-85deg);
        }

        .tail:nth-child(13) {
            transform: translate(-50%, 0) rotate(-102deg);
        }

        /* =====================================
           13. DETECTIVE ACCESSORIES
        ===================================== */

        .magnifier {
            z-index: 25;
            width: 6.5%;
            height: 6.5%;
            left: 25%;
            top: 55%;
            border: 6px solid #b7863f;
            border-radius: 50%;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, .95),
                    rgba(126, 190, 207, .7),
                    rgba(255, 255, 255, .35));
            box-shadow:
                inset 0 0 8px white,
                0 3px 5px rgba(45, 30, 15, .35);
            transform: rotate(-15deg);
        }

        .magnifier::after {
            content: "";
            position: absolute;
            width: 18%;
            height: 78%;
            left: 72%;
            top: 72%;
            background: linear-gradient(90deg,
                    #604027, #b7863f, #604027);
            border: 2px solid #49321f;
            border-radius: 5px;
            transform: rotate(-15deg);
            transform-origin: top center;
        }

        .case-folder {
            z-index: 25;
            width: 8%;
            height: 10%;
            right: 24%;
            top: 54%;
            background: linear-gradient(135deg,
                    #b18a55, #79522e);
            border: 3px solid #49321f;
            border-radius: 5px;
            transform: rotate(10deg);
            box-shadow: 3px 5px 7px rgba(0, 0, 0, .25);
        }

        .case-folder::before {
            content: "CASE FILE";
            position: absolute;
            top: 18%;
            left: 5%;
            right: 5%;
            padding: 5px 1px;
            background: #eee0c2;
            color: #49321f;
            font-family: Georgia, serif;
            font-size: clamp(6px, .8vmin, 10px);
            font-weight: bold;
            text-align: center;
            border: 1px solid #796044;
        }

        .case-folder::after {
            content: "TOP SECRET";
            position: absolute;
            bottom: 10%;
            left: 0;
            right: 0;
            color: #f5e6c9;
            font-family: Georgia, serif;
            font-size: clamp(5px, .65vmin, 8px);
            text-align: center;
            letter-spacing: .5px;
        }
    </style>
</head>

<body>

    <!-- BACKGROUND OFFICE: ALWAYS BEHIND THE TURKEY -->
    <div class="office-scene">

        <div class="window">
            <div class="moon"></div>
        </div>

        <div class="bookshelf">
            <div class="books">
                <span></span><span></span><span></span>
                <span></span><span></span>
            </div>

            <div class="books lower">
                <span></span><span></span><span></span>
                <span></span><span></span>
            </div>
        </div>

        <div class="office-clock">2:17 AM</div>

        <div class="desk"></div>

        <div class="desk-notes"></div>

        <div class="lamp">
            <div class="lamp-glow"></div>
            <div class="lamp-shade"></div>
        </div>

    </div>

    <!-- MAIN DETECTIVE TURKEY -->
    <div class="cartoon">

        <!-- Feather fan -->
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>

        <!-- Legs -->
        <div class="leg"></div>
        <div class="leg"></div>

        <!-- Body and wings -->
        <div class="body"></div>
        <div class="wing"></div>
        <div class="wing"></div>

        <!-- Detective hat -->
        <div class="hat-top"></div>
        <div class="hat-bottom"></div>

        <!-- Face -->
        <div class="head">
            <div class="eye"></div>
            <div class="beak"></div>
            <div class="red"></div>
        </div>

        <!-- Detective accessories -->
        <div class="magnifier"></div>
        <div class="case-folder"></div>

    </div>

</body>

</html>
