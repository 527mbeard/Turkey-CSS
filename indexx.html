<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock Holmes | The Midnight Detective</title>

    <style>
        /* ==========================================
   SHERLOCK HOLMES: THE MIDNIGHT DETECTIVE
   COMPLETE STYLESHEET
========================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #171a20;
        }

        /* ==========================================
   OFFICE BACKGROUND + HARDWOOD FLOOR
========================================== */

        .office-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;

            background:
                linear-gradient(to bottom,
                    #25252a 0%,
                    #171a20 58%,
                    transparent 58%),
                repeating-linear-gradient(90deg,
                    #68452f 0px,
                    #68452f 95px,
                    #4d3023 97px,
                    #795337 100px);
        }

        /* ==========================================
   RAINY WINDOW
========================================== */

        .window {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 270px;
            background:
                linear-gradient(135deg,
                    rgba(117, 155, 174, .25),
                    rgba(24, 43, 59, .9));
            border: 12px solid #493525;
            box-shadow:
                inset 0 0 25px rgba(0, 0, 0, .7),
                0 8px 20px rgba(0, 0, 0, .5);
            overflow: hidden;
        }

        /* Window crossbars */

        .window::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 3;
            background:
                linear-gradient(90deg,
                    transparent 48%,
                    #493525 48%,
                    #493525 52%,
                    transparent 52%),
                linear-gradient(transparent 48%,
                    #493525 48%,
                    #493525 52%,
                    transparent 52%);
        }

        /* Moon */

        .moon {
            position: absolute;
            width: 55px;
            height: 55px;
            top: 35px;
            right: 35px;
            border-radius: 50%;
            background: #f4e7bd;
            box-shadow: 0 0 30px rgba(255, 230, 170, .5);
        }

        /* Rain effect */

        .window::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(105deg,
                    transparent 0 15px,
                    rgba(190, 220, 235, .3) 16px,
                    transparent 18px);
            opacity: .65;
        }

        /* ==========================================
   BOOKSHELF
========================================== */

        .bookshelf {
            position: absolute;
            left: 4%;
            top: 13%;
            width: 210px;
            height: 310px;
            background: linear-gradient(90deg,
                    #38251b,
                    #795337,
                    #422a1d);
            border: 8px solid #38251b;
            box-shadow: 5px 8px 18px rgba(0, 0, 0, .5);
        }

        /* Shelf boards */

        .bookshelf::before,
        .bookshelf::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 12px;
            background: #38251b;
            box-shadow: 0 3px 5px rgba(0, 0, 0, .4);
        }

        .bookshelf::before {
            top: 48%;
        }

        .bookshelf::after {
            bottom: 0;
        }

        /* Books */

        .books {
            position: absolute;
            left: 10px;
            right: 10px;
            height: 43%;
            bottom: 52%;
            display: flex;
            align-items: flex-end;
            gap: 5px;
        }

        /* Book styling */

        .books span {
            display: block;
            width: 25px;
            height: 85%;
            border: 2px solid rgba(0, 0, 0, .3);
            border-radius: 3px 3px 0 0;
            box-shadow: inset 3px 0 rgba(255, 255, 255, .1);
        }

        .books span:nth-child(1) {
            background: #743e35;
            height: 75%;
        }

        .books span:nth-child(2) {
            background: #9a7747;
            height: 90%;
        }

        .books span:nth-child(3) {
            background: #334d48;
            height: 80%;
        }

        .books span:nth-child(4) {
            background: #6d4935;
            height: 95%;
        }

        .books span:nth-child(5) {
            background: #8b6748;
            height: 72%;
        }

        .books span:nth-child(6) {
            background: #493b55;
            height: 87%;
        }

        /* ==========================================
   ANTIQUE CLOCK
========================================== */

        .clock {
            position: absolute;
            top: 12%;
            right: 8%;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #e4d1a8;
            border: 7px solid #513923;
            box-shadow: 0 5px 12px rgba(0, 0, 0, .5);
            color: #493525;
        }

        .clock::before {
            content: "2:17";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: bold;
        }

        /* ==========================================
   SMALL DETECTIVE DESK
========================================== */

        .desk {
            position: absolute;
            width: 480px;
            height: 125px;
            left: 50%;
            bottom: 17%;
            transform: translateX(-50%);
            z-index: 1;

            background:
                repeating-linear-gradient(90deg,
                    transparent 0 35px,
                    rgba(40, 20, 10, .15) 36px 38px),
                linear-gradient(180deg,
                    #966b46,
                    #634128);

            border: 5px solid #38251d;
            border-top: 9px solid #b18455;
            border-radius: 4px;

            box-shadow: 0 12px 25px rgba(0, 0, 0, .5);
        }

        /* Desk front */

        .desk::before {
            content: "";
            position: absolute;
            left: 15px;
            right: 15px;
            top: 15px;
            height: 85px;

            background: #68442e;
            border: 3px solid #422a1d;

            box-shadow: inset 0 0 12px rgba(0, 0, 0, .25);
        }

        /* Desk legs */

        .desk::after {
            content: "";
            position: absolute;
            left: 25px;
            right: 25px;
            top: 115px;
            height: 160px;

            border-left: 13px solid #38251d;
            border-right: 13px solid #38251d;
        }

        /* ==========================================
   CASE NOTES
========================================== */

        .desk-notes {
            position: absolute;
            width: 115px;
            height: 78px;

            left: calc(50% - 205px);
            bottom: calc(17% + 125px);

            z-index: 2;

            background: #dfcfac;
            border: 1px solid #9c805d;
            padding: 8px;

            transform: rotate(-8deg);

            box-shadow: 3px 4px 8px rgba(0, 0, 0, .4);
        }

        .desk-notes::before {
            content: "CASE NOTES";
            display: block;
            font-family: Georgia, serif;
            font-size: 10px;
            font-weight: bold;
            color: #493523;
            border-bottom: 1px solid #ad9875;
            padding-bottom: 5px;
        }

        .desk-notes::after {
            content:
                "Suspect: Unknown\A"
                "Clue: Footprints\A"
                "Status: Open";

            white-space: pre;
            display: block;

            font-family: Georgia, serif;
            font-size: 8px;
            line-height: 13px;
            color: #44372b;
            padding-top: 4px;
        }

        /* ==========================================
   DESK LAMP
========================================== */

        .lamp {
            position: absolute;
            width: 100px;
            height: 150px;

            right: calc(50% - 220px);
            bottom: calc(17% + 125px);

            z-index: 2;
        }

        /* Warm light */

        .lamp-glow {
            position: absolute;
            width: 230px;
            height: 200px;
            left: -65px;
            top: -5px;

            background: radial-gradient(ellipse,
                    rgba(255, 190, 99, .35),
                    rgba(255, 190, 99, .12) 40%,
                    transparent 72%);

            filter: blur(12px);
            pointer-events: none;
        }

        /* Shade */

        .lamp-shade {
            position: absolute;
            top: 0;
            left: 12px;
            width: 85px;
            height: 48px;

            background: linear-gradient(180deg,
                    #d3ad68,
                    #91612f);

            clip-path: polygon(25% 0,
                    75% 0,
                    100% 100%,
                    0 100%);

            filter: drop-shadow(0 0 12px rgba(255, 186, 91, .65));

            z-index: 3;
        }

        /* Bulb */

        .lamp-bulb {
            position: absolute;
            top: 39px;
            left: 43px;
            width: 25px;
            height: 25px;
            border-radius: 50%;

            background: #ffe2a0;

            box-shadow: 0 0 30px 12px rgba(255, 188, 93, .5);
            z-index: 2;
        }

        /* Stem */

        .lamp-stem {
            position: absolute;
            top: 48px;
            left: 49px;
            width: 10px;
            height: 95px;

            background: linear-gradient(90deg,
                    #664326,
                    #d0a05b,
                    #664326);

            border-radius: 5px;
        }

        /* Base */

        .lamp-base {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 70px;
            height: 15px;

            border-radius: 50%;
            background: #a77b40;
            border: 3px solid #50351f;
        }

        /* ==========================================
   TURKEY BASE
========================================== */

        .cartoon {
            --brown1: #753;
            --brown2: #975;
            --orange1: orange;
            --orange2: darkorange;

            width: 80vmin;
            height: 80vmin;

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
            z-index: 5;

            filter: drop-shadow(0 12px 12px rgba(45, 31, 20, .2));
        }

        /* Turkey parts */

        .cartoon div {
            position: absolute;
            box-sizing: border-box;
        }

        /* ==========================================
   BODY + COAT
========================================== */

        .body {
            width: 40%;
            height: 40%;
            top: 40%;
            left: 50%;
            transform: translate(-50%, 0);

            border-radius: 50%;
            border: 3px solid #49321f;

            background: repeating-linear-gradient(90deg,
                    #765338,
                    #765338 8px,
                    #a17d59 8px,
                    #a17d59 11px);

            box-shadow:
                inset 0 0 12px rgba(40, 25, 12, .25),
                -4vmin 14.5vmin 0 -13vmin,
                4vmin 14.5vmin 0 -13vmin;
        }

        /* Golden coat buttons */

        .body::before {
            content: "•";
            position: absolute;
            color: #e4bd68;
            font-size: 25px;
            left: 48%;
            top: 35%;
            text-shadow: 0 20px #e4bd68;
        }

        /* ==========================================
   WINGS
========================================== */

        .wing {
            height: 30%;
            width: 20%;
            top: 41%;
            left: 23%;

            border-radius: 100% 0% 100% 5%;
            transform-origin: top right;
            transform: rotate(-10deg);

            background: repeating-linear-gradient(135deg,
                    #65452f,
                    #65452f 7px,
                    #96704b 7px,
                    #96704b 11px);

            border: 3px solid #49321f;
            z-index: 5;
        }

        .wing+.wing {
            left: auto;
            right: 43%;
            transform: scaleX(-1) rotate(-10deg);
        }

        /* ==========================================
   HEAD + FACE
========================================== */

        .head {
            width: 19%;
            height: 19%;
            top: 15%;
            left: 50%;
            transform: translate(-50%, 0);

            border-radius: 50%;
            clip-path: polygon(0% 20%,
                    100% 20%,
                    100% 500%,
                    0% 500%);

            background: #d8c5a4;
            border: 2px solid #796044;
        }

        .head::before {
            content: "";
            position: absolute;
            width: 40%;
            height: 120%;
            top: 80%;
            left: 50%;
            transform: translate(-50%, 0);

            background: #d8c5a4;
            border-radius: 0 0 100% 100% / 30%;
        }

        /* Eyes */

        .eye {
            width: 10%;
            height: 10%;
            top: 45%;
            left: 50%;
            transform: translate(-50%, 0) translate(-2.5vmin, 0);

            background: black;
            border-radius: 50%;
            box-shadow: 5vmin 0;
        }

        /* Beak */

        .beak {
            width: 4vmin;
            height: 3vmin;
            top: 60%;
            left: 50%;

            border-left: 4vmin solid #b77a35;
            border-top: 1.5vmin solid transparent;
            border-bottom: 1.5vmin solid transparent;
        }

        /* Red snood */

        .red {
            width: 2.5vmin;
            height: 6vmin;
            top: 60%;
            left: 50%;
            transform: translate(-100%, 0);

            background: #d00;
            border-radius: 100% / 100% 0 100% 100%;
        }

        /* ==========================================
   LEGS
========================================== */

        .leg {
            width: 3%;
            height: 21%;
            top: 79%;
            left: 50%;

            transform: translate(-50%, 0) translate(-4vmin, 0);

            background: #b77a35;
            border-radius: 5vmin / 50%;

            background-image: repeating-linear-gradient(transparent 0 10%,
                    rgba(0, 0, 0, .1) 0 11%);
        }

        .leg+.leg {
            transform: translate(-50%, 0) translate(4vmin, 0);
        }

        .leg::before,
        .leg::after {
            content: "";
            position: absolute;
            width: 80%;
            height: 35%;
            left: 50%;
            bottom: 0;

            background: #b77a35;
            border-radius: 5vmin;

            transform-origin: 50% 0;
            transform: translate(-50%, 0) rotate(30deg);
        }

        .leg::after {
            transform: translate(-50%, 0) rotate(-30deg);
        }

        /* ==========================================
   SHERLOCK HOLMES DEERSTALKER HAT
========================================== */

        .hat-bottom {
            width: 35%;
            height: 8%;
            top: 15%;
            left: 50%;
            transform: translate(-50%, 0);

            border-radius: 50%;
            background: #49321f;
            border: 2px solid #2d2118;
        }

        .hat-top {
            width: 16%;
            height: 20%;
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);

            background: repeating-linear-gradient(45deg,
                    #795638,
                    #795638 5px,
                    #b18a5b 5px,
                    #b18a5b 8px);

            border: 3px solid #49321f;
            border-radius: 45% 45% 15% 15%;

            box-shadow: inset 0 5px 8px rgba(255, 255, 255, .2);
        }

        .hat-top::before {
            content: "";
            position: absolute;
            width: 40%;
            height: 2vmin;
            bottom: 3.25vmin;
            left: 50%;
            transform: translate(-50%, 0);

            border: 1vmin solid #772;
            border-radius: 1vmin;
        }

        /* ==========================================
   ALL 13 FEATHERS
========================================== */

        .tail {
            width: 10%;
            height: 40%;
            top: 30%;
            left: 50%;

            transform: translate(-50%, 0);
            transform-origin: 50% 100%;

            border-radius: 100% / 30% 30% 170% 170%;
            border: 2px solid #49301f;
            overflow: visible;

            background: linear-gradient(90deg,
                    #513522 0%,
                    #9a7044 18%,
                    #e0bd7e 34%,
                    #fff0cb 48%,
                    #c18b4b 62%,
                    #76502f 82%,
                    #49301f 100%);

            box-shadow:
                inset 0 3px 5px rgba(255, 255, 255, .45),
                inset 0 -4px 7px rgba(45, 25, 10, .35),
                2px 3px 5px rgba(48, 30, 15, .2);
        }

        /* Alternate feather pattern */

        .tail:nth-child(even) {
            background: linear-gradient(90deg,
                    #49301f 0%,
                    #76502f 18%,
                    #c99a5e 35%,
                    #f6e4bd 50%,
                    #b17d43 66%,
                    #70472b 84%,
                    #382719 100%);
        }

        .tail:nth-child(3n) {
            background: linear-gradient(90deg,
                    #382719 0%,
                    #805532 18%,
                    #d2a45f 35%,
                    #fff0d1 50%,
                    #bd884b 66%,
                    #70452b 84%,
                    #382719 100%);
        }

        /* Feather quill */

        .tail::before {
            content: "";
            position: absolute;
            width: 2px;
            height: 78%;
            left: 50%;
            top: 8%;

            border-radius: 50%;
            background: rgba(75, 45, 23, .65);
            box-shadow: 1px 0 rgba(255, 238, 199, .55);

            transform: translateX(-50%);
        }

        /* Feather eye pattern */

        .tail::after {
            content: "";
            position: absolute;
            width: 28%;
            height: 18%;
            left: 50%;
            top: 22%;

            transform: translateX(-50%);
            border-radius: 50%;

            background: radial-gradient(ellipse,
                    #f8e8c5 0 18%,
                    #9a6a39 22% 42%,
                    #4b3020 48% 65%,
                    transparent 70%);

            opacity: .9;
        }

        /* Feather positions */

        .tail:nth-child(1) {
            transform: translate(-50%, 0) rotate(0deg);
        }

        .tail:nth-child(2) {
            transform: translate(-50%, 0) rotate(17deg);
        }

        .tail:nth-child(3) {
            transform: translate(-50%, 0) rotate(34deg);
        }

        .tail:nth-child(4) {
            transform: translate(-50%, 0) rotate(51deg);
        }

        .tail:nth-child(5) {
            transform: translate(-50%, 0) rotate(68deg);
        }

        .tail:nth-child(6) {
            transform: translate(-50%, 0) rotate(85deg);
        }

        .tail:nth-child(7) {
            transform: translate(-50%, 0) rotate(102deg);
        }

        .tail:nth-child(8) {
            transform: translate(-50%, 0) rotate(-17deg);
        }

        .tail:nth-child(9) {
            transform: translate(-50%, 0) rotate(-34deg);
        }

        .tail:nth-child(10) {
            transform: translate(-50%, 0) rotate(-51deg);
        }

        .tail:nth-child(11) {
            transform: translate(-50%, 0) rotate(-68deg);
        }

        .tail:nth-child(12) {
            transform: translate(-50%, 0) rotate(-85deg);
        }

        .tail:nth-child(13) {
            transform: translate(-50%, 0) rotate(-102deg);
        }

        /* ==========================================
   MAGNIFYING GLASS
========================================== */

        .magnifier {
            position: absolute;
            z-index: 25;

            width: 6.5%;
            height: 6.5%;

            left: 25%;
            top: 55%;

            border: 6px solid #b7863f;
            border-radius: 50%;

            background: linear-gradient(135deg,
                    rgba(255, 255, 255, .95),
                    rgba(126, 190, 207, .7),
                    rgba(255, 255, 255, .35));

            box-shadow:
                inset 0 0 8px white,
                0 3px 5px rgba(45, 30, 15, .35);

            transform: rotate(-15deg);
        }

        .magnifier::after {
            content: "";
            position: absolute;

            width: 18%;
            height: 78%;
            left: 72%;
            top: 72%;

            background: linear-gradient(90deg,
                    #604027,
                    #b7863f,
                    #604027);

            border: 2px solid #49321f;
            border-radius: 5px;

            transform: rotate(-15deg);
            transform-origin: top center;
        }

        /* ==========================================
   CASE FOLDER
========================================== */

        .case-folder {
            position: absolute;
            z-index: 25;

            width: 8%;
            height: 10%;

            right: 24%;
            top: 54%;

            background: linear-gradient(135deg,
                    #b18a55,
                    #79522e);

            border: 3px solid #49321f;
            border-radius: 5px;

            transform: rotate(10deg);

            box-shadow: 3px 5px 7px rgba(0, 0, 0, .25);
        }

        .case-folder::before {
            content: "CASE FILE";
            position: absolute;

            top: 18%;
            left: 5%;
            right: 5%;

            padding: 5px 1px;

            background: #eee0c2;
            color: #49321f;

            font-family: Georgia, serif;
            font-size: clamp(6px, .8vmin, 10px);
            font-weight: bold;
            text-align: center;

            border: 1px solid #796044;
        }

        .case-folder::after {
            content: "TOP SECRET";
            position: absolute;

            bottom: 10%;
            left: 0;
            right: 0;

            color: #f5e6c9;

            font-family: Georgia, serif;
            font-size: clamp(5px, .65vmin, 8px);
            text-align: center;
            letter-spacing: .5px;
        }

        /* ==========================================
   SMALL SCREEN ADJUSTMENTS
========================================== */

        @media (max-width: 650px) {

            .desk {
                width: 90%;
                height: 110px;
            }

            .desk::after {
                height: 110px;
            }

            .desk-notes {
                left: 8%;
                transform: rotate(-8deg) scale(.85);
                transform-origin: bottom left;
            }

            .lamp {
                right: 7%;
                transform: scale(.85);
                transform-origin: bottom right;
            }

            .bookshelf {
                left: 1%;
                transform: scale(.75);
                transform-origin: top left;
            }
        }
    </style>
</head>

<body>

    <!-- BACKGROUND OFFICE: ALWAYS BEHIND THE TURKEY -->
    <div class="office-scene">

        <div class="window">
            <div class="moon"></div>
        </div>

        <div class="bookshelf">
            <div class="books">
                <span></span><span></span><span></span>
                <span></span><span></span>
            </div>

            <div class="books lower">
                <span></span><span></span><span></span>
                <span></span><span></span>
            </div>
        </div>

        <div class="office-clock">2:17 AM</div>

        <div class="desk"></div>

        <div class="desk-notes"></div>

        <div class="lamp">
            <div class="lamp-glow"></div>
            <div class="lamp-shade"></div>
        </div>

    </div>

    <!-- MAIN DETECTIVE TURKEY -->
    <div class="cartoon">

        <!-- Feather fan -->
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>

        <!-- Legs -->
        <div class="leg"></div>
        <div class="leg"></div>

        <!-- Body and wings -->
        <div class="body"></div>
        <div class="wing"></div>
        <div class="wing"></div>

        <!-- Detective hat -->
        <div class="hat-top"></div>
        <div class="hat-bottom"></div>

        <!-- Face -->
        <div class="head">
            <div class="eye"></div>
            <div class="beak"></div>
            <div class="red"></div>
        </div>

        <!-- Detective accessories -->
        <div class="magnifier"></div>
        <div class="case-folder"></div>

    </div>

</body>

</html>
