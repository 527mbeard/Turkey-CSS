  “Thanksgiving Turkey” by Álvaro Montoro

  Original HTML and CSS, with classroom comments added.

  BEFORE CLASS
  Open this file in a browser as your finished reference. Save a second
  copy as index.html. In that copy, remove the CSS from STEP 1 through
  the last .tail:nth-child rule. Keep the three page setup rules, the
  corner badge styles and all the HTML. Have the two files open side
  by side in VS Code. Save and refresh after each step.

  LIVE-CODING ORDER | ABOUT 30 MINUTES
  1. Body (4 min) — Center the rectangle, then round it into a circle.
  2. Wings (4 min) — Draw one wing and mirror the other.
  3. Head, neck and face (7 min) — Reveal the neck with ::before.
     Then add the two eyes, triangle beak and red snood.
  4. Legs and toes (4 min) — Reuse one leg style and rotate the toes.
  5. Hat (4 min) — Build the brim and crown, then add the buckle.
  6. Feather fan (7 min) — Start with one visible feather. Rotate
     around its base, then reveal the full fan and alternating colors.

  QUICK CLASS CHECK
  Ask students to point to one example of symmetry and one of repetition.
  For a DevTools experiment, toggle the neck's ::before rule or change a
  feather's pivot. Refresh to bring back the original design.

/* =================================
   FROZEN WINTER WONDERLAND TURKEY
   Elsa-inspired winter aesthetic
================================= */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap');

html, body {
    overflow: hidden;
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(ellipse at 50% 35%, #ffffff 0%, #eaf8ff 45%, #c5e5f5 100%);
}

/* WINTER COLOR PALETTE */

.cartoon {
    --ice1: #b9e6f5;
    --ice2: #83cce8;
    --ice3: #4c9fca;
    --ice4: #dff6ff;
    --lavender: #c8b9ed;
    --silver: #e9f5fc;
    --white: #ffffff;
    --deep: #4d83a8;

    width: 80vmin;
    height: 80vmin;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 15px 20px #5689a522);
}

.cartoon div {
    position: absolute;
    box-sizing: border-box;
}

/* FLOATING MAGIC */

@keyframes float {
    0%, 100% {
        translate: 0 0;
    }
    50% {
        translate: 0 -9px;
    }
}

/* SNOWY FEATHER FAN */

.tail {
    width: 10%;
    height: 40%;
    top: 30%;
    left: 50%;
    border-radius: 100% / 30% 30% 170% 170%;
    transform-origin: 50% 100%;
    transform: translate(-50%, 0);
    background: linear-gradient(
        90deg,
        #75b9dc,
        #e7faff,
        #a7dff2
    );
    border: 2px solid #ffffff;
    box-shadow:
        inset 0 0 12px #ffffff,
        0 0 12px #a4dff7;
}

/* Alternating icy shades */

.tail:nth-child(odd) {
    background: linear-gradient(
        90deg,
        #83c8e7,
        #f4fdff,
        #a6d9ef
    );
}

.tail:nth-child(even) {
    background: linear-gradient(
        90deg,
        #a99bdc,
        #f8f4ff,
        #b8dcf5
    );
}

/* Snowflake-like feather details */

.tail::before {
    content: "✧";
    position: absolute;
    color: white;
    font-size: 3vmin;
    top: 20%;
    left: 30%;
    text-shadow: 0 0 8px #ffffff;
}

.tail::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 35%;
    background: #ffffffaa;
    top: 35%;
    left: 50%;
    border-radius: 50%;
}

/* FEATHER FAN SHAPE */

.tail:nth-child(1) {
    transform: translate(-50%, 0) rotate(0deg);
}
.tail:nth-child(2) {
    transform: translate(-50%, 0) rotate(17deg);
}
.tail:nth-child(3) {
    transform: translate(-50%, 0) rotate(34deg);
}
.tail:nth-child(4) {
    transform: translate(-50%, 0) rotate(51deg);
}
.tail:nth-child(5) {
    transform: translate(-50%, 0) rotate(68deg);
}
.tail:nth-child(6) {
    transform: translate(-50%, 0) rotate(85deg);
}
.tail:nth-child(7) {
    transform: translate(-50%, 0) rotate(102deg);
}
.tail:nth-child(8) {
    transform: translate(-50%, 0) rotate(-17deg);
}
.tail:nth-child(9) {
    transform: translate(-50%, 0) rotate(-34deg);
}
.tail:nth-child(10) {
    transform: translate(-50%, 0) rotate(-51deg);
}
.tail:nth-child(11) {
    transform: translate(-50%, 0) rotate(-68deg);
}
.tail:nth-child(12) {
    transform: translate(-50%, 0) rotate(-85deg);
}
.tail:nth-child(13) {
    transform: translate(-50%, 0) rotate(-102deg);
}

/* BODY - SOFT SNOWBALL */

.body {
    width: 43%;
    height: 43%;
    background: linear-gradient(
        145deg,
        #f5fdff,
        #c6e9f8 65%,
        #a5d3ec
    );
    border-radius: 50%;
    top: 40%;
    left: 50%;
    transform: translate(-50%, 0);
    border: 3px solid white;
    box-shadow:
        inset -10px -12px 22px #83bcd955,
        inset 10px 10px 20px white,
        0 8px 22px #80b8d755,
        -4vmin 14.5vmin 0 -13vmin,
        4vmin 14.5vmin 0 -13vmin;
    z-index: 3;
}

/* Crystal belly */

.body::before {
    content: "✧";
    position: absolute;
    font-size: 9vmin;
    color: white;
    text-shadow:
        0 0 8px #ffffff,
        0 0 18px #83cce8;
    top: 25%;
    left: 37%;
}

/* WINGS */

.wing {
    height: 30%;
    width: 20%;
    background: linear-gradient(
        135deg,
        #e9faff,
        #9ed6ee,
        #b6a9df
    );
    border-radius: 100% 0% 100% 5%;
    top: 41%;
    left: 23%;
    transform-origin: top right;
    transform: rotate(-10deg);
    border: 2px solid white;
    box-shadow:
        inset 0 0 12px white,
        0 4px 12px #80b9d755;
    z-index: 4;
}

.wing + .wing {
    left: auto;
    right: 43%;
    transform: scaleX(-1) rotate(-10deg);
}

/* HEAD */

.head {
    width: 21%;
    height: 21%;
    border-radius: 50%;
    background: linear-gradient(
        140deg,
        #f9feff,
        #c7e9f8,
        #a6d6ef
    );
    top: 15%;
    left: 50%;
    transform: translate(-50%, 0);
    border: 3px solid white;
    box-shadow:
        inset -5px -5px 15px #8bbbd755,
        inset 5px 5px 12px white,
        0 0 15px #ffffff;
    z-index: 6;
    clip-path: none;
}

/* NECK */

.head::before {
    content: "";
    display: block;
    position: absolute;
    width: 40%;
    height: 120%;
    background: linear-gradient(
        90deg,
        #b9e0f3,
        #f6fdff,
        #b9e0f3
    );
    top: 80%;
    left: 50%;
    transform: translate(-50%, 0);
    border-radius: 0 0 100% 100% / 30%;
    z-index: -1;
}

/* BIG SPARKLY EYES */

.eye {
    width: 11%;
    height: 12%;
    background: #31516f;
    border-radius: 50%;
    top: 45%;
    left: 50%;
    transform: translate(-50%, 0) translate(-2.5vmin, 0);
    box-shadow:
        5vmin 0 #31516f,
        0 0 5px #ffffff;
    z-index: 5;
}

.eye::before {
    content: "";
    position: absolute;
    width: 38%;
    height: 38%;
    background: white;
    border-radius: 50%;
    top: 12%;
    left: 17%;
    box-shadow: 5vmin 0 white;
}

/* ICY BLUE BEAK */

.beak {
    width: 4vmin;
    height: 3vmin;
    border-left: 4vmin solid #83b9e0;
    border-top: 1.5vmin solid transparent;
    border-bottom: 1.5vmin solid transparent;
    top: 60%;
    left: 50%;
    filter: drop-shadow(0 2px 2px #477ca3);
    z-index: 5;
}

/* LAVENDER CHEEK DETAIL */

.red {
    width: 2.5vmin;
    height: 5vmin;
    background: #c8a9e9;
    border-radius: 100% / 100% 0 100% 100%;
    top: 60%;
    left: 50%;
    transform: translate(-100%, 0);
    z-index: 5;
}

/* LITTLE ICY FEET */

.leg {
    width: 3%;
    height: 21%;
    background: linear-gradient(
        90deg,
        #91c8e8,
        #e2f6ff,
        #8bbde0
    );
    top: 79%;
    left: 50%;
    transform: translate(-50%, 0) translate(-4vmin, 0);
    border-radius: 5vmin / 50%;
    box-shadow: 0 0 8px #ffffff;
    z-index: 2;
}

.leg + .leg {
    transform: translate(-50%, 0) translate(4vmin, 0);
}

.leg::before,
.leg::after {
    content: "";
    display: block;
    position: absolute;
    width: 80%;
    height: 35%;
    left: 50%;
    bottom: 0;
    background: #b7a9e2;
    border-radius: 5vmin;
    transform-origin: 50% 0;
    transform: translate(-50%, 0) rotate(30deg);
}

.leg::after {
    transform: translate(-50%, 0) rotate(-30deg);
}

/* ELSA'S ICE CROWN */

.hat-bottom {
    width: 35%;
    height: 8%;
    border-radius: 50%;
    background: linear-gradient(
        90deg,
        #8bbfe5,
        #ffffff,
        #b9a8e7
    );
    border: 2px solid white;
    top: 15%;
    left: 50%;
    transform: translate(-50%, 0);
    box-shadow: 0 0 12px #ffffff;
    z-index: 8;
}

.hat-top {
    width: 23%;
    height: 19%;
    background: linear-gradient(
        135deg,
        #e9faff,
        #8ec9e9,
        #b7a6e4
    );
    clip-path: polygon(
        0 100%,
        12% 40%,
        28% 70%,
        50% 0,
        72% 70%,
        88% 40%,
        100% 100%
    );
    top: 0;
    left: 50%;
    transform: translate(-50%, 0);
    border-radius: 15%;
    filter: drop-shadow(0 0 8px white);
    z-index: 9;
}

/* SNOWFLAKE JEWEL ON CROWN */

.hat-top::before {
    content: "✧";
    display: block;
    position: absolute;
    font-size: 5vmin;
    color: white;
    text-shadow:
        0 0 5px white,
        0 0 12px #72c8f0;
    bottom: 0;
    left: 50%;
    transform: translate(-50%, 0);
}

    /* WINTER WONDERLAND BACKGROUND */

body::before {
    content: "❄       ✧          ❄       ✧";
    position: fixed;
    top: 8%;
    left: 5%;
    width: 90%;
    color: white;
    font-size: 5vmin;
    letter-spacing: 5vmin;
    text-shadow: 0 0 12px #75c8f0;
    pointer-events: none;
    animation: sparkle 3s ease-in-out infinite alternate;
}

@keyframes sparkle {
    from {
        opacity: .35;
        transform: translateY(0);
    }
    to {
        opacity: 1;
        transform: translateY(12px);
    }
}
   </style>
